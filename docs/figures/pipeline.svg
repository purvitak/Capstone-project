<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/></marker></defs>
<rect width="1280" height="1280" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="50" y="48" font-size="28" font-weight="700" fill="#0f172a">Mumbai day-ahead GHI forecasting pipeline</text>
<text x="50" y="78" font-size="16" fill="#475569">144 ten-minute values issued at 00:00 IST · Saved evaluation: 25 July 2025–24 July 2026</text>
<rect x="50" y="110" width="700" height="90" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="68" y="139" font-size="18" font-weight="700" fill="#0f172a">1. Historical Solcast Mumbai data and preparation</text>
<text x="68" y="165" font-size="16" fill="#334155">IST alignment, quality checks, 144-slot daily profiles</text>
<text x="68" y="188" font-size="16" fill="#334155">Development-derived clear-sky climatology and daylight mask</text>
<rect x="50" y="230" width="700" height="90" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="68" y="259" font-size="18" font-weight="700" fill="#0f172a">2. Historical neural inputs</text>
<text x="68" y="285" font-size="16" fill="#334155">Day D−1 GHI → six-level Haar DWT → seven resampled bands</text>
<text x="68" y="308" font-size="16" fill="#334155">Append historical sky-type channels; apply training-only scaling</text>
<rect x="50" y="350" width="700" height="90" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="68" y="379" font-size="18" font-weight="700" fill="#0f172a">3. Stage 1: DWT–BiLSTM</text>
<text x="68" y="405" font-size="16" fill="#334155">One bidirectional layer, 64 hidden units per direction</text>
<text x="68" y="428" font-size="16" fill="#334155">Direct output: 144 predicted day-D clear-sky-index values</text>
<rect x="50" y="470" width="700" height="90" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="68" y="499" font-size="18" font-weight="700" fill="#0f172a">4. Stage 1 GHI forecast</text>
<text x="68" y="525" font-size="16" fill="#334155">Predicted index × known day-D clear-sky proxy</text>
<text x="68" y="548" font-size="16" fill="#334155">Daylight ten-minute RMSE: 116.72802 W/m²</text>
<rect x="840" y="350" width="390" height="113" rx="12" fill="#ede9fe" stroke="#94a3b8"/>
<text x="858" y="379" font-size="18" font-weight="700" fill="#0f172a">Corrector training (development only)</text>
<text x="858" y="405" font-size="16" fill="#334155">Expanding-window OOF forecasts</text>
<text x="858" y="428" font-size="16" fill="#334155">1,293 days → residual targets</text>
<text x="858" y="451" font-size="16" fill="#334155">969 fitting / 324 validation days</text>
<rect x="840" y="490" width="390" height="113" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="858" y="519" font-size="18" font-weight="700" fill="#0f172a">Available at forecast issue time</text>
<text x="858" y="545" font-size="16" fill="#334155">Base index forecast and D−1 errors</text>
<text x="858" y="568" font-size="16" fill="#334155">Known day-D solar/calendar context</text>
<text x="858" y="591" font-size="16" fill="#334155">Previous-day historical summaries</text>
<rect x="50" y="640" width="700" height="113" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="68" y="669" font-size="18" font-weight="700" fill="#0f172a">5. Stage 2: trained HGB residual corrector</text>
<text x="68" y="695" font-size="16" fill="#334155">Selected 57 boosting iterations; refit on all OOF days</text>
<text x="68" y="718" font-size="16" fill="#334155">Bounded index update: monsoon 0.10; other months 0.05</text>
<text x="68" y="741" font-size="16" fill="#334155">Validation residual quantiles → nominal 80% intervals</text>
<rect x="50" y="790" width="700" height="90" rx="12" fill="#dcfce7" stroke="#94a3b8"/>
<text x="68" y="819" font-size="18" font-weight="700" fill="#0f172a">6. Corrected GHI and interval output</text>
<text x="68" y="845" font-size="16" fill="#334155">Corrected index and interval bounds × clear-sky proxy</text>
<text x="68" y="868" font-size="16" fill="#334155">Daylight ten-minute RMSE: 114.06405 W/m²</text>
<rect x="50" y="920" width="700" height="90" rx="12" fill="#e2e8f0" stroke="#94a3b8"/>
<text x="68" y="949" font-size="18" font-weight="700" fill="#0f172a">7. Archived forecast dashboard</text>
<text x="68" y="975" font-size="16" fill="#334155">Saved GHI predictions, actuals, intervals and CSV export</text>
<text x="68" y="998" font-size="16" fill="#334155">On-demand illustrative temperature-adjusted PV power and energy</text>
<path d="M400,200 L400,230" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,320 L400,350" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,440 L400,470" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,753 L400,790" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,880 L400,920" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M400,560 L400,640" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,395 L840,395" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1035,463 L790,463 L790,680 L750,680" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<path d="M1035,603 L1035,710 L750,710" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M750,160 L1248,160 L1248,547 L1230,547" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<text x="50" y="1060" font-size="18" font-weight="700" fill="#0f172a">Recorded outcome</text>
<text x="50" y="1090" font-size="17" fill="#334155">Correction reduces RMSE by 2.66397 W/m² (2.28221%); nominal 80% interval coverage is 77.33123%.</text>
<text x="50" y="1126" font-size="16" fill="#475569">Dashed arrows: training flow. Solid arrows: preparation and forecast flow.</text>
<text x="50" y="1152" font-size="16" fill="#475569">Historical observations end at D−1. Day-D observed GHI is used for evaluation, not forecast inputs.</text>
<text x="50" y="1178" font-size="16" fill="#475569">Dashboard PV is illustrative; saved forecast replay is not a live future-day inference service.</text>
<text x="50" y="1225" font-size="14" fill="#64748b">Source: results/dwt_10min_150_paper · Native daylight evaluation: 365 days / 24,086 points</text>
</g></svg>